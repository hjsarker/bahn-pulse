name: Refresh verified railway observations
on:
  schedule:
    - cron: '17 8 5,15 * *'
      timezone: 'Europe/Berlin'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bahnpulse-monthly-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Confirm current published snapshot is valid
        run: python -m pipeline.refresh --check
      - name: Check the latest completed month and refresh if published
        run: python -m pipeline.refresh
      - name: Validate the latest output and run tests
        run: |
          python -m pipeline.refresh --check
          python -m pytest -q
      - name: Commit only the compact validated snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data.json.gz
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh latest verified rail stop snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
