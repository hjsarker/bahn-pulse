name: BahnPulse CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m pipeline.refresh --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('web/index.html').read_text()
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          assert scripts, 'Missing frontend JavaScript'
          Path('/tmp/bahnpulse-app.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/bahnpulse-app.js
